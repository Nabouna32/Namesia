name: Sécurité des workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
      - ci/workflow-security-audit
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Lecture seule : inspecter les workflows et la configuration Dependabot.
permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Linter et auditer la configuration CI
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Vérifier les workflows et leurs scripts shell
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          files: ".github/workflows/*.yml"
          shellcheck: true
          pyflakes: false

      - name: Auditer les workflows et Dependabot
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: ".github"
          collect: "all"
          strict-collection: "true"
          online-audits: "true"
          persona: "pedantic"
          version: "1.33.1"
          advanced-security: "false"
          annotations: "true"

  toolchain-lock:
    name: Générer le lockfile des outils CI
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/workflow-security-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Écriture temporaire limitée à cette branche pour enregistrer le lockfile généré par npm.
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/workflow-security-audit
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Générer le manifeste et le lockfile des outils
        run: npm install --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund @opennextjs/cloudflare@1.20.18 wrangler@4.148.0 @playwright/test@1.65.1 @axe-core/playwright@4.14.0
      - name: Enregistrer le lockfile sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Le lockfile des outils est déjà à jour."
            exit 0
          fi
          git commit -m "Verrouiller les outils de la CI"
          git push origin HEAD:ci/workflow-security-audit
