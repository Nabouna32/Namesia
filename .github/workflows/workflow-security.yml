name: Sécurité des workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Linter et auditer la configuration CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Vérifier les workflows et leurs scripts shell
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          files: ".github/workflows/*.yml"
          shellcheck: true
          pyflakes: false

      - name: Auditer les workflows et Dependabot
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: ".github"
          collect: "all"
          strict-collection: "true"
          online-audits: "true"
          persona: "pedantic"
          version: "1.33.1"
          advanced-security: "false"
          annotations: "true"
