name: Vérifications

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main

jobs:
  quality:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurer le cache Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Vérifier la version Node.js
        run: test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Auditer les dépendances de production
        id: audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Vérifier la politique de déploiement Vercel
        shell: bash
        run: |
          set -euo pipefail
          verifier_code() {
            local attendu="$1"
            shift
            local obtenu=0
            set +e
            env "$@" bash scripts/vercel-ignore-build.sh >/dev/null
            obtenu=$?
            set -e
            if [[ "$obtenu" -ne "$attendu" ]]; then
              echo "Code attendu : $attendu ; code obtenu : $obtenu"
              exit 1
            fi
          }
          verifier_code 1 VERCEL_ENV=production VERCEL_GIT_COMMIT_REF=main
          verifier_code 0 VERCEL_ENV=production VERCEL_GIT_COMMIT_REF=feature
          verifier_code 0 VERCEL_ENV=preview VERCEL_GIT_COMMIT_REF=main
          verifier_code 0 VERCEL_ENV=preview VERCEL_GIT_COMMIT_REF=feature
          verifier_code 0 VERCEL_ENV=production
      - name: Vérifier les sources Material 3 épinglées
        run: node scripts/verify-design-sources.mjs
      - name: Tester les contrats locaux
        id: tests
        run: npm test
        continue-on-error: true
      - name: Vérifier les types
        id: typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Construire le site
        id: build
        run: npm run build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ftiikxwjaduecvuexlkk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QMGPd9f06uaubb8QpCTF9A_jH4y0fwA
          NEXT_PUBLIC_SITE_URL: https://namesia.vercel.app
      - name: Résumer les contrôles
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'Audit production : %s\nTests : %s\nTypes : %s\nBuild : %s\n' "$AUDIT_OUTCOME" "$TEST_OUTCOME" "$TYPECHECK_OUTCOME" "$BUILD_OUTCOME"
          if [[ "$AUDIT_OUTCOME" != "success" || "$TEST_OUTCOME" != "success" || "$TYPECHECK_OUTCOME" != "success" || "$BUILD_OUTCOME" != "success" ]]; then
            exit 1
          fi

  cloudflare:
    needs: quality
    if: needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund
      - name: Charger la configuration publique
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.example
          set +a
          echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://namesia.nabouna.workers.dev' }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - name: Construire l’application pour Cloudflare
        run: npx --yes --package=@opennextjs/cloudflare@1.20.18 --package=wrangler@4.136.3 opennextjs-cloudflare build
      - name: Déployer une Preview Cloudflare
        id: preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@4.136.3 preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Vérifier la Preview
        if: steps.preview.outputs.preview_url != ''
        run: curl --fail --show-error --silent --retry 8 --retry-delay 5 "$PREVIEW_URL/" -o /tmp/namesia-preview.html
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - name: Publier l’URL de Preview dans la PR
        if: steps.preview.outputs.preview_url != ''
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "Preview Cloudflare : $PREVIEW_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
      - name: Déployer la production Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: npx --yes --package=@opennextjs/cloudflare@1.20.18 --package=wrangler@4.136.3 opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Supprimer la Preview Cloudflare
        run: npx --yes wrangler@4.136.3 preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
