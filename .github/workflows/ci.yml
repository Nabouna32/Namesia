name: Vérifications

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Vérifier le code et les dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restaurer le cache Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - name: Vérifier la version Node.js
        run: test "$(node --version)" = "v$(tr -d '\r\n' < .nvmrc)"
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Auditer les dépendances de production
        id: audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Diagnostiquer les dépendances de développement
        id: audit_full
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Vérifier les types
        id: typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Construire le site
        id: build
        run: npm run build
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ftiikxwjaduecvuexlkk.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QMGPd9f06uaubb8QpCTF9A_jH4y0fwA
          NEXT_PUBLIC_SITE_URL: https://namesia.nabouna.workers.dev
      - name: Résumer les contrôles
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_FULL_OUTCOME: ${{ steps.audit_full.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          printf 'Audit production : %s\nAudit complet (diagnostic non bloquant) : %s\nTests : %s\nTypes : %s\nBuild : %s\n' "$AUDIT_OUTCOME" "$AUDIT_FULL_OUTCOME" "$TEST_OUTCOME" "$TYPECHECK_OUTCOME" "$BUILD_OUTCOME"
          if [[ "$AUDIT_OUTCOME" != "success" || "$TYPECHECK_OUTCOME" != "success" || "$BUILD_OUTCOME" != "success" ]]; then
            exit 1
          fi
