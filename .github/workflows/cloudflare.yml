name: Déploiement Cloudflare

on:
  pull_request:
    types: [labeled, closed]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construire, diagnostiquer localement et déployer
    outputs:
      test_url: ${{ steps.local_worker.outputs.test_url }}
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'diagnostic-playwright' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund
      - name: Charger la configuration publique
        shell: bash
        env:
          SITE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8787' || vars.NEXT_PUBLIC_SITE_URL || 'https://namesia.nabouna.workers.dev' }}
        run: |
          set -euo pipefail
          set -a
          source .env.example
          set +a
          {
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Construire l’application pour Cloudflare
        run: ./node_modules/.bin/opennextjs-cloudflare build
      - name: Démarrer le Worker Cloudflare localement
        if: github.event_name == 'pull_request'
        id: local_worker
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/namesia-wrangler.log"
          ./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port 8787 >"$log_file" 2>&1 &
          server_pid=$!
          echo "$server_pid" > "$RUNNER_TEMP/namesia-wrangler.pid"

          for _ in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8787/ --output /dev/null; then
              echo "test_url=http://127.0.0.1:8787" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat "$log_file"
          exit 1
      - name: Vérifier le Worker Cloudflare local
        if: steps.local_worker.outputs.test_url != ''
        env:
          TEST_URL: ${{ steps.local_worker.outputs.test_url }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          headers="$(mktemp)"
          admin="$(mktemp)"
          trap 'rm -f "$response" "$headers" "$admin"' EXIT
          curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --dump-header "$headers" "$TEST_URL/" --output "$response"
          grep -Eiq '<!doctype html|<html' "$response"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$TEST_URL/prenoms" --output /dev/null
          curl --fail --show-error --silent --location --max-time 30 "$TEST_URL/admin" --output "$admin"
          grep -q 'Administration indisponible' "$admin"
          admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$TEST_URL/api/admin/prenoms")"
          test "$admin_status" = "403"
      - name: Restaurer le cache Chromium
        if: steps.local_worker.outputs.test_url != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.65.1
      - name: Installer Chromium
        if: steps.local_worker.outputs.test_url != ''
        run: npx playwright install --with-deps chromium
      - name: Vérifier les parcours publics avec Playwright
        if: steps.local_worker.outputs.test_url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.local_worker.outputs.test_url }}
          PLAYWRIGHT_DIAGNOSTICS: ${{ contains(github.event.pull_request.labels.*.name, 'diagnostic-playwright') && 'true' || 'false' }}
        run: npx playwright test --config=playwright.config.mjs
      - name: Publier les diagnostics Playwright ponctuels
        if: always() && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'diagnostic-playwright'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-playwright-pr-${{ github.event.pull_request.number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 1
      - name: Déployer la production Cloudflare
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: ./node_modules/.bin/opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Vérifier le Worker déployé
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://namesia.nabouna.workers.dev' }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE_URL/" --output "$response"
          grep -Eiq '<!doctype html|<html' "$response"
      - name: Vérifier les parcours publics et la frontière administrateur
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://namesia.nabouna.workers.dev' }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          check_html() {
            local path="$1"
            local output="$2"
            curl --fail --show-error --silent --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$SITE_URL$path" --output "$output"
            grep -Eiq '<!doctype html|<html' "$output"
          }

          check_html "/prenoms" "$workdir/catalogue.html"
          check_html "/prenoms/alice" "$workdir/fiche.html"
          grep -Eiq '<title>[^<]*Alice' "$workdir/fiche.html"
          echo "Vérifier la référence Open Graph statique dans le HTML de la fiche"

          curl --fail --show-error --silent --location --max-time 30 "$SITE_URL/robots.txt" --output "$workdir/robots.txt"
          grep -Eiq '^Disallow: /admin' "$workdir/robots.txt"
          grep -Eiq '^Disallow: /api' "$workdir/robots.txt"
          grep -Fq "Sitemap: $SITE_URL/sitemap.xml" "$workdir/robots.txt"

          curl --fail --show-error --silent --location --max-time 30 "$SITE_URL/sitemap.xml" --output "$workdir/sitemap.xml"
          grep -Fq "$SITE_URL/prenoms/alice" "$workdir/sitemap.xml"

          curl --fail --show-error --silent --location --max-time 30 "$SITE_URL/api/prenoms?slug=alice&slug=emma" --output "$workdir/comparison.json"
          jq -e '[.prenoms[].slug] | index("alice") != null and index("emma") != null' "$workdir/comparison.json"

          curl --fail --show-error --silent --location --max-time 30 \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/settings" \
            --output "$workdir/auth-settings.json"
          jq -e '.external.email == true' "$workdir/auth-settings.json"

          echo "Vérifier l’image Open Graph générale"
          og_type="$(curl --fail --show-error --silent --location --max-time 30 --output /dev/null --write-out '%{content_type}' "$SITE_URL/opengraph-image")"
          test "$og_type" = "image/png"

          for method in GET POST; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request "$method" "$SITE_URL/api/admin/prenoms")"
            test "$status" = "401"
          done
  cleanup:
    name: Nettoyer une ancienne Preview Cloudflare
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund
      - name: Supprimer la Preview Cloudflare
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +e
          output="$(./node_modules/.bin/wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if grep -Fq 'Preview not found. [code: 10025]' <<< "$output"; then
            echo "La Preview est déjà absente : le nettoyage est terminé."
            exit 0
          fi

          echo "Échec inattendu lors de la suppression de la Preview Cloudflare."
          exit "$status"
