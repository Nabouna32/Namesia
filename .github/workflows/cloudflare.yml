name: Déploiement Cloudflare

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances du projet
        run: npm ci --no-audit --no-fund
      - name: Installer les outils Cloudflare épinglés
        run: npm install --no-save --package-lock=false --no-audit --no-fund @opennextjs/cloudflare@1.20.18 wrangler@4.148.0
      - name: Charger la configuration publique
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.example
          set +a
          echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://namesia.nabouna.workers.dev' }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
      - name: Construire l’application pour Cloudflare
        run: ./node_modules/.bin/opennextjs-cloudflare build
      - name: Créer ou mettre à jour la Preview Cloudflare
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          output="$(./node_modules/.bin/wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          preview_json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s\n' "$preview_json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Vérifier la Preview Cloudflare
        if: steps.preview.outputs.preview_url != ''
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          headers="$(mktemp)"
          admin="$(mktemp)"
          trap 'rm -f "$response" "$headers" "$admin"' EXIT
          curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 --dump-header "$headers" "$PREVIEW_URL/" --output "$response"
          grep -Eiq '<!doctype html|<html' "$response"
          grep -Eiq '^x-robots-tag:.*noindex' "$headers"
          curl --fail --show-error --silent --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$PREVIEW_URL/prenoms" --output /dev/null
          curl --fail --show-error --silent --location --max-time 30 "$PREVIEW_URL/admin" --output "$admin"
          grep -q 'Administration indisponible' "$admin"
          admin_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$PREVIEW_URL/api/admin/prenoms")"
          test "$admin_status" = "403"
      - name: Installer Playwright et axe-core
        if: steps.preview.outputs.preview_url != ''
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.65.1 @axe-core/playwright@4.14.0
      - name: Installer Chromium
        if: steps.preview.outputs.preview_url != ''
        run: npx playwright install --with-deps chromium
      - name: Capturer et auditer les pages publiques
        if: steps.preview.outputs.preview_url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: npx playwright test --config=playwright.config.mjs
      - name: Publier les captures et rapports visuels
        if: always() && steps.preview.outputs.preview_url != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-visuel-pr-${{ github.event.pull_request.number }}
          path: |
            artifacts/visual/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 3
      - name: Publier l’URL de Preview dans la PR
        if: steps.preview.outputs.preview_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Preview Cloudflare — $PREVIEW_URL"
      - name: Déployer la production Cloudflare
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: ./node_modules/.bin/opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Vérifier le Worker déployé
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://namesia.nabouna.workers.dev' }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --show-error --silent --location --retry 8 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE_URL/" --output "$response"
          grep -Eiq '<!doctype html|<html' "$response"
      - name: Vérifier les parcours publics et la frontière administrateur
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://namesia.nabouna.workers.dev' }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          check_html() {
            local path="$1"
            local output="$2"
            curl --fail --show-error --silent --location --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$SITE_URL$path" --output "$output"
            grep -Eiq '<!doctype html|<html' "$output"
          }

          check_html "/prenoms" "$workdir/catalogue.html"
          check_html "/prenoms/alice" "$workdir/fiche.html"
          grep -Eiq '<title>[^<]*Alice' "$workdir/fiche.html"
          echo "Vérifier la référence Open Graph statique dans le HTML de la fiche"
          grep -Fq "opengraph-image" "$workdir/fiche.html"

          curl --fail --show-error --silent --location --max-time 30 "$SITE_URL/robots.txt" --output "$workdir/robots.txt"
          grep -Eiq '^Disallow: /admin' "$workdir/robots.txt"
          grep -Eiq '^Disallow: /api' "$workdir/robots.txt"
          grep -Fq "Sitemap: $SITE_URL/sitemap.xml" "$workdir/robots.txt"

          curl --fail --show-error --silent --location --max-time 30 "$SITE_URL/sitemap.xml" --output "$workdir/sitemap.xml"
          grep -Fq "$SITE_URL/prenoms/alice" "$workdir/sitemap.xml"

          curl --fail --show-error --silent --location --max-time 30 "$SITE_URL/api/prenoms?slug=alice&slug=emma" --output "$workdir/comparison.json"
          jq -e '[.prenoms[].slug] | index("alice") != null and index("emma") != null' "$workdir/comparison.json"

          curl --fail --show-error --silent --location --max-time 30 \
            --header "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/settings" \
            --output "$workdir/auth-settings.json"
          jq -e '.external.email == true' "$workdir/auth-settings.json"

          echo "Vérifier l’image Open Graph générale"
          og_type="$(curl --fail --show-error --silent --location --max-time 30 --output /dev/null --write-out '%{content_type}' "$SITE_URL/opengraph-image")"
          test "$og_type" = "image/png"

          for method in GET POST; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request "$method" "$SITE_URL/api/admin/prenoms")"
            test "$status" = "401"
          done
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Installer Wrangler épinglé
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.148.0
      - name: Supprimer la Preview Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(./node_modules/.bin/wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if grep -Fq 'Preview not found. [code: 10025]' <<< "$output"; then
            echo "La Preview est déjà absente : le nettoyage est terminé."
            exit 0
          fi

          echo "Échec inattendu lors de la suppression de la Preview Cloudflare."
          exit "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
