name: Générer une fiche avec Groq

on:
  workflow_dispatch:
    inputs:
      display_name:
        description: Graphie du prénom à générer
        required: true
        type: string
      gender:
        description: Genre du prénom
        required: true
        type: choice
        options:
          - feminin
          - masculin
          - mixte
          - inconnu
      import_as_draft:
        description: Importer la fiche validée dans Supabase comme brouillon
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: groq-generation
  cancel-in-progress: false

jobs:
  generate:
    name: Générer et valider une fiche
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund

      - name: Charger l’URL Supabase publique
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.example
          set +a
          echo "SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"

      - name: Générer, valider et éventuellement importer
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          GENDER: ${{ inputs.gender }}
          IMPORT_AS_DRAFT: ${{ inputs.import_as_draft }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ inputs.import_as_draft && secrets.SUPABASE_SECRET_KEY || '' }}
        run: npm run generate:fiche

      - name: Conserver le JSON généré temporairement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fiche-groq-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
