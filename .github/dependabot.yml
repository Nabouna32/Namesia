version: 2

updates:
  # npm couvre les dépendances de production, de développement et transitives.
  # Chaque mise à jour reste une PR distincte pour permettre une revue explicite.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 12 * * *"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000

  # Les actions des workflows CI, de contrôle et de déploiement sont suivies
  # individuellement ; leurs SHA complets restent à vérifier avant fusion.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 12 * * *"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000
