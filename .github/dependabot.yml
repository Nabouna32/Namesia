version: 2

updates:
  # npm couvre toutes les dépendances déclarées, y compris celles de développement.
  # Le lockfile suit les mises à jour directes ; les transitives vulnérables relèvent aussi des alertes de sécurité.
  # Chaque mise à jour reste une PR distincte ; le cooldown de sécurité GitHub (3 jours) est conservé.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 12 * * *"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000

  # Les actions des workflows CI, de contrôle et de déploiement sont suivies
  # individuellement ; leurs SHA complets restent à vérifier avant fusion.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 12 * * *"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000
