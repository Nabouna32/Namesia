version: 2

updates:
  # Vérification quotidienne ; chaque mise à jour reste isolée dans sa propre PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 12 * * *"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 12 * * *"
      timezone: Europe/Paris
    open-pull-requests-limit: 1000
    cooldown:
      default-days: 7
